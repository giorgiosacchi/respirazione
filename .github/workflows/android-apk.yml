name: Compila APK Respirazione
on:
  push:
    branches:
      - android-apk
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installa SDK Android 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Incorpora i file web e la musica
        run: |
          mkdir -p android/app/src/main/assets/music android/app/src/main/res/drawable
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png sw.js android/app/src/main/assets/
          cp music/*.js android/app/src/main/assets/music/
          cp icon-192.png android/app/src/main/res/drawable/app_icon.png
          test "$(find android/app/src/main/assets/music -name 'part-*.js' | wc -l)" -eq 17
      - name: Compila APK installabile
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Prepara file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Respirazione-Android.apk
      - name: Conserva APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Respirazione-Android-APK
          path: Respirazione-Android.apk
          if-no-files-found: error
      - name: Pubblica APK per il download diretto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v1.0.0-20261116 Respirazione-Android.apk \
            --target "$GITHUB_SHA" \
            --title "Respirazione per Android 1.0" \
            --notes "Versione APK installabile. Basata sulla versione web del 31 ottobre 2026, con timer, impostazioni e musica disponibili offline. Pacchetto di test firmato per installazione diretta." \
            --latest=false
